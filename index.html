<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <title>SOAR Parent Check-In</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&family=DM+Serif+Display&family=Spline+Sans+Mono:wght@500;700&display=swap');
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }
        
        :root {
            --primary: #2C5F7C;
            --primary-dark: #1E4158;
            --accent: #E8934E;
            --success: #5FA85C;
            --bg: #F8F9FA;
            --card: #FFFFFF;
            --text: #2D3748;
            --text-light: #718096;
            --border: #E2E8F0;
            --shadow: rgba(0, 0, 0, 0.08);
        }
        
        body {
            font-family: 'Manrope', -apple-system, sans-serif;
            background: linear-gradient(135deg, #F8F9FA 0%, #E8EFF5 100%);
            min-height: 100vh;
            color: var(--text);
            padding: 16px;
            -webkit-font-smoothing: antialiased;
        }
        
        .container {
            max-width: 500px;
            margin: 0 auto;
        }
        
        .header {
            text-align: center;
            margin-bottom: 32px;
            animation: fadeInDown 0.6s ease-out;
        }
        
        .logo {
            font-family: 'DM Serif Display', serif;
            font-size: 2.8rem;
            color: var(--primary);
            margin-bottom: 4px;
            letter-spacing: -0.5px;
        }
        
        .tagline {
            color: var(--text-light);
            font-size: 1rem;
            font-weight: 500;
        }
        
        .card {
            background: var(--card);
            border-radius: 20px;
            padding: 28px;
            box-shadow: 0 4px 24px var(--shadow);
            animation: fadeInUp 0.6s ease-out 0.1s both;
        }
        
        .card-title {
            font-size: 1.75rem;
            font-weight: 700;
            margin-bottom: 12px;
            color: var(--primary);
            text-align: center;
        }
        
        .card-subtitle {
            text-align: center;
            color: var(--text-light);
            margin-bottom: 28px;
            font-size: 0.95rem;
        }
        
        .form-group {
            margin-bottom: 24px;
        }
        
        label {
            display: block;
            font-weight: 600;
            margin-bottom: 10px;
            color: var(--text);
            font-size: 1rem;
        }
        
        input, select {
            width: 100%;
            padding: 18px 16px;
            border: 2px solid var(--border);
            border-radius: 12px;
            font-family: 'Manrope', sans-serif;
            font-size: 16px;
            transition: all 0.3s ease;
            background: var(--bg);
            -webkit-appearance: none;
            min-height: 56px;
        }
        
        input:focus, select:focus {
            outline: none;
            border-color: var(--primary);
            background: white;
            box-shadow: 0 0 0 4px rgba(44, 95, 124, 0.1);
        }
        
        .btn {
            width: 100%;
            padding: 16px;
            border: none;
            border-radius: 14px;
            font-family: 'Manrope', sans-serif;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
            margin-bottom: 12px;
            min-height: 56px;
            touch-action: manipulation;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
        }
        
        .btn-primary {
            background: var(--primary);
            color: white;
        }
        
        .btn-primary:active {
            background: var(--primary-dark);
            transform: scale(0.98);
        }
        
        .btn-secondary {
            background: transparent;
            color: var(--primary);
            border: 2px solid var(--primary);
        }
        
        .btn-secondary:active {
            background: var(--primary);
            color: white;
        }
        
        .btn-sso {
            background: white;
            color: var(--text);
            border: 2px solid var(--border);
        }
        
        .btn-sso:active {
            background: var(--bg);
        }
        
        .btn-google {
            background: white;
            color: var(--text);
            border: 2px solid var(--border);
        }
        
        .btn-apple {
            background: #000;
            color: white;
            border: none;
        }
        
        .btn-microsoft {
            background: white;
            color: var(--text);
            border: 2px solid var(--border);
        }
        
        .btn-facebook {
            background: #1877F2;
            color: white;
            border: none;
        }
        
        .btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none !important;
        }
        
        .btn-text {
            background: none;
            border: none;
            color: var(--text-light);
            font-size: 0.95rem;
            padding: 12px;
            cursor: pointer;
            min-height: auto;
        }
        
        .divider {
            display: flex;
            align-items: center;
            gap: 12px;
            margin: 24px 0;
        }
        
        .divider-line {
            flex: 1;
            height: 1px;
            background: var(--border);
        }
        
        .divider-text {
            color: var(--text-light);
            font-size: 0.9rem;
        }
        
        .student-search {
            position: relative;
        }
        
        .search-results {
            position: absolute;
            top: 100%;
            left: 0;
            right: 0;
            background: white;
            border: 2px solid var(--border);
            border-radius: 12px;
            margin-top: 8px;
            max-height: 320px;
            overflow-y: auto;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.15);
            z-index: 100;
            display: none;
        }
        
        .search-results.active {
            display: block;
            animation: fadeIn 0.2s ease-out;
        }
        
        .search-result-item {
            padding: 18px 16px;
            cursor: pointer;
            transition: background 0.2s;
            border-bottom: 1px solid var(--border);
            min-height: 68px;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }
        
        .search-result-item:last-child {
            border-bottom: none;
        }
        
        .search-result-item:active {
            background: var(--bg);
        }
        
        .search-result-name {
            font-weight: 600;
            color: var(--text);
            font-size: 1.05rem;
        }
        
        .search-result-info {
            font-size: 0.9rem;
            color: var(--text-light);
            margin-top: 4px;
        }
        
        .selected-students-container {
            background: var(--bg);
            padding: 16px;
            border-radius: 12px;
            margin-top: 20px;
            margin-bottom: 24px;
        }
        
        .selected-students-header {
            font-size: 0.9rem;
            font-weight: 600;
            color: var(--text-light);
            margin-bottom: 12px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        
        .student-chip {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: var(--primary);
            color: white;
            padding: 14px 16px;
            border-radius: 12px;
            margin-bottom: 8px;
            font-size: 1rem;
            animation: scaleIn 0.3s ease-out;
        }
        
        .student-chip button {
            background: rgba(255, 255, 255, 0.2);
            border: none;
            color: white;
            width: 32px;
            height: 32px;
            border-radius: 50%;
            cursor: pointer;
            font-size: 1.3rem;
            line-height: 1;
            transition: background 0.2s;
            flex-shrink: 0;
            margin-left: 12px;
        }
        
        .student-chip button:active {
            background: rgba(255, 255, 255, 0.3);
        }
        
        .student-checkbox {
            display: flex;
            align-items: center;
            gap: 14px;
            padding: 18px 16px;
            background: var(--bg);
            border: 2px solid var(--border);
            border-radius: 12px;
            margin-bottom: 10px;
            cursor: pointer;
            transition: all 0.2s;
            min-height: 60px;
        }
        
        .student-checkbox.selected {
            background: #E8F4F8;
            border-color: var(--primary);
        }
        
        .student-checkbox:active {
            transform: scale(0.98);
        }
        
        .checkbox {
            width: 24px;
            height: 24px;
            border-radius: 6px;
            border: 2px solid #CBD5E0;
            background: white;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            transition: all 0.2s;
        }
        
        .student-checkbox.selected .checkbox {
            background: var(--primary);
            border-color: var(--primary);
        }
        
        .checkmark {
            color: white;
            font-weight: bold;
            font-size: 16px;
            display: none;
        }
        
        .student-checkbox.selected .checkmark {
            display: block;
        }
        
        .student-checkbox.selected .checkmark::before {
            content: '✓';
        }
        
        .student-info {
            flex: 1;
        }
        
        .student-checkbox-name {
            font-weight: 600;
            font-size: 1.05rem;
            color: var(--text);
        }
        
        .student-checkbox-grade {
            font-size: 0.9rem;
            color: var(--text-light);
        }
        
        .event-grid {
            display: grid;
            gap: 14px;
        }
        
        .event-card {
            background: var(--bg);
            border: 2px solid var(--border);
            border-radius: 14px;
            padding: 24px 20px;
            cursor: pointer;
            transition: all 0.2s ease;
            text-align: left;
            min-height: 68px;
            display: flex;
            align-items: center;
        }
        
        .event-card:active {
            border-color: var(--primary);
            background: white;
            transform: scale(0.98);
        }
        
        .event-card.disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        
        .event-name {
            font-weight: 600;
            color: var(--text);
            font-size: 1.1rem;
        }
        
        .user-info {
            background: var(--bg);
            padding: 16px;
            border-radius: 12px;
            margin-bottom: 28px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        .user-email {
            font-size: 0.95rem;
            color: var(--text-light);
        }
        
        .logout-btn {
            background: none;
            border: none;
            color: var(--primary);
            font-weight: 600;
            cursor: pointer;
            font-size: 0.95rem;
            padding: 8px 12px;
        }
        
        .success-animation {
            text-align: center;
            padding: 32px 20px;
        }
        
        .checkmark-circle {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            background: var(--success);
            margin: 0 auto 24px;
            display: flex;
            align-items: center;
            justify-content: center;
            animation: scaleIn 0.5s ease-out;
        }
        
        .checkmark-circle svg {
            width: 56px;
            height: 56px;
            stroke: white;
            stroke-width: 3;
            fill: none;
            animation: drawCheck 0.5s ease-out 0.3s both;
        }
        
        .success-message {
            font-size: 1.75rem;
            font-weight: 700;
            color: var(--success);
            margin-bottom: 12px;
        }
        
        .success-detail {
            color: var(--text-light);
            margin-bottom: 20px;
            font-size: 1.05rem;
            line-height: 1.6;
        }
        
        .family-total-card {
            background: #E8F4F8;
            padding: 24px;
            border-radius: 12px;
            margin-bottom: 32px;
        }
        
        .family-total-label {
            font-size: 0.9rem;
            color: var(--text-light);
            margin-bottom: 12px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            font-weight: 600;
        }
        
        .family-total-number {
            font-size: 3rem;
            font-weight: 700;
            color: var(--primary);
            margin-bottom: 8px;
            font-family: 'Spline Sans Mono', monospace;
        }
        
        .family-total-text {
            font-size: 1rem;
            color: var(--text-light);
        }
        
        .hidden {
            display: none;
        }
        
        .loading {
            text-align: center;
            padding: 40px;
            color: var(--text-light);
        }
        
        .spinner {
            border: 3px solid var(--border);
            border-top: 3px solid var(--primary);
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto 16px;
        }
        
        @keyframes fadeInDown {
            from {
                opacity: 0;
                transform: translateY(-20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        
        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        
        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }
        
        @keyframes scaleIn {
            from {
                opacity: 0;
                transform: scale(0.8);
            }
            to {
                opacity: 1;
                transform: scale(1);
            }
        }
        
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        
        @keyframes drawCheck {
            from {
                stroke-dasharray: 100;
                stroke-dashoffset: 100;
            }
            to {
                stroke-dasharray: 100;
                stroke-dashoffset: 0;
            }
        }
        
        .error-message {
            background: #FEE;
            color: #C33;
            padding: 14px;
            border-radius: 10px;
            margin-bottom: 20px;
            font-size: 1rem;
        }
        
        .info-message {
            background: #E8F4F8;
            color: var(--primary);
            padding: 16px;
            border-radius: 12px;
            margin-bottom: 24px;
            font-size: 1rem;
            line-height: 1.5;
        }
        
        .info-message strong {
            display: block;
            margin-bottom: 4px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <div class="logo">SOAR</div>
            <div class="tagline">Parent Check-In</div>
        </div>

        <!-- Auth Screen with SSO -->
        <div id="authScreen" class="card">
            <h2 class="card-title">Welcome Back</h2>
            <p class="card-subtitle">Sign in to check in your students</p>
            <div id="authError" class="error-message hidden"></div>
            
            <!-- SSO Options (default) -->
            <div id="ssoOptions">
                <button class="btn btn-google" onclick="signInWithGoogle()">
                    <svg width="20" height="20" viewBox="0 0 20 20">
                        <path fill="#4285F4" d="M19.6 10.23c0-.82-.1-1.42-.25-2.05H10v3.72h5.5c-.15.96-.74 2.31-2.04 3.22v2.45h3.16c1.89-1.73 2.98-4.3 2.98-7.34z"/>
                        <path fill="#34A853" d="M13.46 15.13c-.83.59-1.96 1-3.46 1-2.64 0-4.88-1.74-5.68-4.15H1.07v2.52C2.72 17.75 6.09 20 10 20c2.7 0 4.96-.89 6.62-2.42l-3.16-2.45z"/>
                        <path fill="#FBBC05" d="M3.99 10c0-.69.12-1.35.32-1.97V5.51H1.07A9.973 9.973 0 000 10c0 1.61.39 3.14 1.07 4.49l3.24-2.52c-.2-.62-.32-1.28-.32-1.97z"/>
                        <path fill="#EA4335" d="M10 3.88c1.88 0 3.13.81 3.85 1.48l2.84-2.76C14.96.99 12.7 0 10 0 6.09 0 2.72 2.25 1.07 5.51l3.24 2.52C5.12 5.62 7.36 3.88 10 3.88z"/>
                    </svg>
                    Continue with Google
                </button>

                <button class="btn btn-apple" onclick="signInWithApple()">
                    <svg width="20" height="20" viewBox="0 0 20 20" fill="white">
                        <path d="M15.5 9.5c0 2.5 2.1 3.4 2.2 3.4-.1.1-.3 1.2-1.2 2.4-.8 1-1.6 2-2.8 2-1.2 0-1.5-.7-2.9-.7-1.3 0-1.8.7-2.9.7-1.1 0-2-.9-2.8-2-1.7-2.4-3-6.7-1.2-9.6.9-1.4 2.4-2.3 4-2.3 1.3 0 2.3.8 3.1.8.8 0 2-.9 3.4-.8.6 0 2.1.2 3.1 1.7-2 1.2-1.7 4.4 0 5.4-.3.6-.9 1.2-1.5 1.7v.3zm-2.8-8.3c.7-.9 1.2-2.1 1-3.2-1 .1-2.3.7-3 1.5-.7.8-1.3 2-1.1 3.2 1.2.1 2.4-.6 3.1-1.5z"/>
                    </svg>
                    Continue with Apple
                </button>

                <button class="btn btn-microsoft" onclick="signInWithMicrosoft()">
                    <svg width="20" height="20" viewBox="0 0 20 20">
                        <path fill="#f25022" d="M0 0h9.5v9.5H0z"/>
                        <path fill="#00a4ef" d="M10.5 0H20v9.5h-9.5z"/>
                        <path fill="#7fba00" d="M0 10.5h9.5V20H0z"/>
                        <path fill="#ffb900" d="M10.5 10.5H20V20h-9.5z"/>
                    </svg>
                    Continue with Microsoft
                </button>

                <button class="btn btn-facebook" onclick="signInWithFacebook()">
                    <svg width="20" height="20" viewBox="0 0 20 20" fill="white">
                        <path d="M20 10c0-5.52-4.48-10-10-10S0 4.48 0 10c0 4.99 3.66 9.12 8.44 9.88v-6.99H5.9V10h2.54V7.8c0-2.51 1.49-3.89 3.78-3.89 1.09 0 2.24.19 2.24.19v2.47h-1.26c-1.24 0-1.63.77-1.63 1.56V10h2.78l-.44 2.89h-2.34v6.99C16.34 19.12 20 14.99 20 10z"/>
                    </svg>
                    Continue with Facebook
                </button>

                <div class="divider">
                    <div class="divider-line"></div>
                    <span class="divider-text">or</span>
                    <div class="divider-line"></div>
                </div>

                <button class="btn btn-secondary" onclick="showEmailForm()">Sign in with Email</button>
            </div>

            <!-- Email/Password Form (hidden by default) -->
            <div id="emailForm" class="hidden">
                <div class="form-group">
                    <label>Email</label>
                    <input type="email" id="loginEmail" placeholder="parent@email.com" autocomplete="email">
                </div>
                <div class="form-group">
                    <label>Password</label>
                    <input type="password" id="loginPassword" placeholder="Enter your password" autocomplete="current-password">
                </div>
                <button class="btn btn-primary" onclick="login()">Sign In</button>
                <button class="btn btn-secondary" onclick="showSignup()">Create Account</button>
                <button class="btn btn-text" onclick="showSSOOptions()">← Back to sign-in options</button>
            </div>

            <!-- Signup Form -->
            <div id="signupForm" class="hidden">
                <div class="form-group">
                    <label>Email</label>
                    <input type="email" id="signupEmail" placeholder="parent@email.com" autocomplete="email">
                </div>
                <div class="form-group">
                    <label>Password</label>
                    <input type="password" id="signupPassword" placeholder="Create a password (min 6 characters)" autocomplete="new-password">
                </div>
                <div class="form-group">
                    <label>Confirm Password</label>
                    <input type="password" id="signupPasswordConfirm" placeholder="Confirm your password" autocomplete="new-password">
                </div>
                <button class="btn btn-primary" onclick="signup()">Create Account</button>
                <button class="btn btn-text" onclick="showEmailForm()">← Back to sign in</button>
            </div>
        </div>

        <!-- Student Setup Screen -->
        <div id="setupScreen" class="card hidden">
            <h2 class="card-title">Link Your Students</h2>
            <div class="info-message">
                <strong>Add all your students!</strong>
                Search and tap each one. You only need to do this once.
            </div>
            
            <div class="form-group student-search">
                <label>Search for Student</label>
                <input type="text" id="studentSearch" placeholder="Type student name..." autocomplete="off">
                <div id="searchResults" class="search-results"></div>
            </div>

            <div id="selectedStudents"></div>

            <button class="btn btn-primary" onclick="saveStudents()" id="saveStudentsBtn" disabled>Continue</button>
        </div>

        <!-- Main Check-in Screen -->
        <div id="checkinScreen" class="card hidden">
            <div class="user-info">
                <span class="user-email" id="userEmail"></span>
                <button class="logout-btn" onclick="logout()">Sign Out</button>
            </div>

            <h2 class="card-title">Check In</h2>
            
            <div class="form-group">
                <label>Select Student(s)</label>
                <div id="studentCheckboxes"></div>
            </div>

            <div class="form-group">
                <label id="eventLabel">Select students first</label>
                <div id="eventGrid" class="event-grid"></div>
            </div>
        </div>

        <!-- Success Screen -->
        <div id="successScreen" class="card hidden">
            <div class="success-animation">
                <div class="checkmark-circle">
                    <svg viewBox="0 0 52 52">
                        <path d="M14 27l7.5 7.5L38 18"/>
                    </svg>
                </div>
                <div class="success-message">Thank You!</div>
                <div class="success-detail">
                    <span id="successStudentNames"></span>
                    <br />
                    <span id="successEventName"></span>
                </div>
                
                <div class="family-total-card">
                    <div class="family-total-label" id="successSchoolYear">2024-2025 School Year</div>
                    <div class="family-total-number" id="successFamilyTotal">0</div>
                    <div class="family-total-text">Family Check-Ins</div>
                </div>
                
                <button class="btn btn-primary" onclick="returnToCheckin()">Check In Again</button>
                <button class="btn btn-secondary" onclick="logout()">Done for Today</button>
            </div>
        </div>

        <!-- Loading Screen -->
        <div id="loadingScreen" class="card hidden">
            <div class="loading">
                <div class="spinner"></div>
                <div>Loading...</div>
            </div>
        </div>
    </div>

    <!-- Firebase -->
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script>

    <script>
        // Firebase configuration - REPLACE WITH YOUR FIREBASE CONFIG
        const firebaseConfig = {
            apiKey: "YOUR_API_KEY",
            authDomain: "YOUR_PROJECT.firebaseapp.com",
            databaseURL: "https://YOUR_PROJECT.firebaseio.com",
            projectId: "YOUR_PROJECT",
            storageBucket: "YOUR_PROJECT.appspot.com",
            messagingSenderId: "YOUR_SENDER_ID",
            appId: "YOUR_APP_ID"
        };

        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const db = firebase.database();

        let currentUser = null;
        let allStudents = [];
        let allEvents = [];
        let selectedStudentsList = [];
        let userLinkedStudents = [];
        let selectedStudentIds = [];

        // Cache management
        const CACHE_DURATION = 24 * 60 * 60 * 1000;

        function getCache(key) {
            const cached = localStorage.getItem(key);
            if (!cached) return null;
            const { data, timestamp } = JSON.parse(cached);
            if (Date.now() - timestamp > CACHE_DURATION) {
                localStorage.removeItem(key);
                return null;
            }
            return data;
        }

        function setCache(key, data) {
            localStorage.setItem(key, JSON.stringify({
                data,
                timestamp: Date.now()
            }));
        }

        // School year functions
        function getCurrentSchoolYear() {
            const today = new Date();
            const currentYear = today.getFullYear();
            const currentMonth = today.getMonth();
            const schoolYearStart = currentMonth < 6 ? currentYear - 1 : currentYear;
            return {
                start: schoolYearStart,
                end: schoolYearStart + 1,
                startDate: new Date(schoolYearStart, 6, 1),
                endDate: new Date(schoolYearStart + 1, 5, 30, 23, 59, 59)
            };
        }

        async function getFamilyYearTotal(familyKey) {
            const schoolYear = getCurrentSchoolYear();
            const startTimestamp = schoolYear.startDate.getTime();
            const endTimestamp = schoolYear.endDate.getTime();
            
            try {
                const checkinRef = db.ref('checkins');
                const snapshot = await checkinRef.once('value');
                
                let total = 0;
                snapshot.forEach(dateSnap => {
                    dateSnap.forEach(checkinSnap => {
                        const checkin = checkinSnap.val();
                        if (checkin.timestamp >= startTimestamp && checkin.timestamp <= endTimestamp) {
                            const student = allStudents.find(s => s.id === checkin.studentId);
                            if (student && student.familyKey === familyKey) {
                                total++;
                            }
                        }
                    });
                });
                
                return total;
            } catch (error) {
                console.error('Error getting family total:', error);
                return 0;
            }
        }

        // Initialize
        auth.onAuthStateChanged(async (user) => {
            if (user) {
                currentUser = user;
                await loadData();
                await checkUserSetup();
            } else {
                showScreen('authScreen');
            }
        });

        async function loadData() {
            showScreen('loadingScreen');
            
            const cachedStudents = getCache('students');
            const cachedEvents = getCache('events');
            
            if (cachedStudents && cachedEvents) {
                allStudents = cachedStudents;
                allEvents = cachedEvents;
                return;
            }

            try {
                const [studentsSnap, eventsSnap] = await Promise.all([
                    db.ref('students').once('value'),
                    db.ref('events').once('value')
                ]);

                allStudents = [];
                studentsSnap.forEach(child => {
                    allStudents.push({ id: child.key, ...child.val() });
                });

                allEvents = [];
                eventsSnap.forEach(child => {
                    allEvents.push({ id: child.key, ...child.val() });
                });

                setCache('students', allStudents);
                setCache('events', allEvents);
            } catch (error) {
                console.error('Error loading data:', error);
                showError('Failed to load data. Please try again.');
            }
        }

        async function checkUserSetup() {
            const userDataSnap = await db.ref(`users/${currentUser.uid}`).once('value');
            const userData = userDataSnap.val();

            if (userData && userData.linkedStudents && userData.linkedStudents.length > 0) {
                userLinkedStudents = userData.linkedStudents;
                showCheckinScreen();
            } else {
                showSetupScreen();
            }
        }

        // SSO Sign-In Functions
        async function signInWithGoogle() {
            const provider = new firebase.auth.GoogleAuthProvider();
            try {
                await auth.signInWithPopup(provider);
            } catch (error) {
                console.error('Google sign-in error:', error);
                if (error.code !== 'auth/popup-closed-by-user') {
                    showError(error.message);
                }
            }
        }

        async function signInWithApple() {
            const provider = new firebase.auth.OAuthProvider('apple.com');
            try {
                await auth.signInWithPopup(provider);
            } catch (error) {
                console.error('Apple sign-in error:', error);
                if (error.code !== 'auth/popup-closed-by-user') {
                    showError(error.message);
                }
            }
        }

        async function signInWithMicrosoft() {
            const provider = new firebase.auth.OAuthProvider('microsoft.com');
            try {
                await auth.signInWithPopup(provider);
            } catch (error) {
                console.error('Microsoft sign-in error:', error);
                if (error.code !== 'auth/popup-closed-by-user') {
                    showError(error.message);
                }
            }
        }

        async function signInWithFacebook() {
            const provider = new firebase.auth.FacebookAuthProvider();
            try {
                await auth.signInWithPopup(provider);
            } catch (error) {
                console.error('Facebook sign-in error:', error);
                if (error.code !== 'auth/popup-closed-by-user') {
                    showError(error.message);
                }
            }
        }

        // Email/Password Functions
        async function login() {
            const email = document.getElementById('loginEmail').value;
            const password = document.getElementById('loginPassword').value;

            if (!email || !password) {
                showError('Please enter email and password');
                return;
            }

            try {
                await auth.signInWithEmailAndPassword(email, password);
            } catch (error) {
                showError(error.message);
            }
        }

        async function signup() {
            const email = document.getElementById('signupEmail').value;
            const password = document.getElementById('signupPassword').value;
            const confirmPassword = document.getElementById('signupPasswordConfirm').value;

            if (!email || !password) {
                showError('Please enter email and password');
                return;
            }

            if (password.length < 6) {
                showError('Password must be at least 6 characters');
                return;
            }

            if (password !== confirmPassword) {
                showError('Passwords do not match');
                return;
            }

            try {
                await auth.createUserWithEmailAndPassword(email, password);
            } catch (error) {
                showError(error.message);
            }
        }

        function logout() {
            auth.signOut();
        }

        // UI Navigation
        function showSSOOptions() {
            document.getElementById('ssoOptions').classList.remove('hidden');
            document.getElementById('emailForm').classList.add('hidden');
            document.getElementById('signupForm').classList.add('hidden');
            clearError();
        }

        function showEmailForm() {
            document.getElementById('ssoOptions').classList.add('hidden');
            document.getElementById('emailForm').classList.remove('hidden');
            document.getElementById('signupForm').classList.add('hidden');
            clearError();
        }

        function showSignup() {
            document.getElementById('ssoOptions').classList.add('hidden');
            document.getElementById('emailForm').classList.add('hidden');
            document.getElementById('signupForm').classList.remove('hidden');
            clearError();
        }

        // Fuzzy Search
        function fuzzyMatch(str, pattern) {
            const strLower = str.toLowerCase();
            const patternLower = pattern.toLowerCase();
            let strIndex = 0, patternIndex = 0, score = 0;
            while (strIndex < str.length && patternIndex < pattern.length) {
                if (strLower[strIndex] === patternLower[patternIndex]) {
                    score++;
                    patternIndex++;
                }
                strIndex++;
            }
            return patternIndex === pattern.length ? score : 0;
        }

        function searchStudents(query) {
            if (!query || query.length < 2) return [];
            return allStudents
                .map(student => ({
                    student,
                    score: fuzzyMatch(`${student.firstName} ${student.lastName}`, query)
                }))
                .filter(result => result.score > 0)
                .sort((a, b) => b.score - a.score)
                .slice(0, 10)
                .map(result => result.student);
        }

        document.addEventListener('DOMContentLoaded', () => {
            const searchInput = document.getElementById('studentSearch');
            const searchResults = document.getElementById('searchResults');

            searchInput?.addEventListener('input', (e) => {
                const query = e.target.value;
                if (query.length < 2) {
                    searchResults.classList.remove('active');
                    return;
                }
                const results = searchStudents(query);
                displaySearchResults(results);
            });

            document.addEventListener('click', (e) => {
                if (!e.target.closest('.student-search')) {
                    searchResults.classList.remove('active');
                }
            });
        });

        function displaySearchResults(results) {
            const searchResults = document.getElementById('searchResults');
            if (results.length === 0) {
                searchResults.innerHTML = '<div style="padding: 18px; color: var(--text-light);">No students found</div>';
                searchResults.classList.add('active');
                return;
            }
            searchResults.innerHTML = results.map(student => `
                <div class="search-result-item" onclick="selectStudent('${student.id}')">
                    <div class="search-result-name">${student.firstName} ${student.lastName}</div>
                    <div class="search-result-info">Grade ${student.grade} • ID: ${student.studentId}</div>
                </div>
            `).join('');
            searchResults.classList.add('active');
        }

        function selectStudent(studentId) {
            const student = allStudents.find(s => s.id === studentId);
            if (!student || selectedStudentsList.find(s => s.id === studentId)) return;
            selectedStudentsList.push(student);
            updateSelectedStudents();
            document.getElementById('studentSearch').value = '';
            document.getElementById('searchResults').classList.remove('active');
            document.getElementById('saveStudentsBtn').disabled = false;
        }

        function removeStudent(studentId) {
            selectedStudentsList = selectedStudentsList.filter(s => s.id !== studentId);
            updateSelectedStudents();
            if (selectedStudentsList.length === 0) {
                document.getElementById('saveStudentsBtn').disabled = true;
            }
        }

        function updateSelectedStudents() {
            const container = document.getElementById('selectedStudents');
            if (selectedStudentsList.length === 0) {
                container.innerHTML = '';
                return;
            }
            container.innerHTML = `
                <div class="selected-students-container">
                    <div class="selected-students-header">Selected (${selectedStudentsList.length})</div>
                    ${selectedStudentsList.map(student => `
                        <div class="student-chip">
                            <span>${student.firstName} ${student.lastName} <span style="opacity: 0.8;">(Grade ${student.grade})</span></span>
                            <button onclick="removeStudent('${student.id}')">×</button>
                        </div>
                    `).join('')}
                </div>
            `;
            const btn = document.getElementById('saveStudentsBtn');
            btn.textContent = `Continue with ${selectedStudentsList.length} student${selectedStudentsList.length > 1 ? 's' : ''}`;
        }

        async function saveStudents() {
            if (selectedStudentsList.length === 0) return;
            const studentIds = selectedStudentsList.map(s => s.id);
            try {
                await db.ref(`users/${currentUser.uid}`).set({
                    email: currentUser.email,
                    linkedStudents: studentIds
                });
                userLinkedStudents = studentIds;
                showCheckinScreen();
            } catch (error) {
                console.error('Error saving students:', error);
                showError('Failed to save students. Please try again.');
            }
        }

        function showCheckinScreen() {
            selectedStudentIds = [];
            renderStudentCheckboxes();
            renderEventCards();
            document.getElementById('userEmail').textContent = currentUser.email;
            showScreen('checkinScreen');
        }

        function renderStudentCheckboxes() {
            const container = document.getElementById('studentCheckboxes');
            const linkedStudents = allStudents.filter(s => userLinkedStudents.includes(s.id));
            container.innerHTML = linkedStudents.map(student => `
                <div class="student-checkbox" data-student-id="${student.id}" onclick="toggleStudent('${student.id}')">
                    <div class="checkbox"><span class="checkmark"></span></div>
                    <div class="student-info">
                        <div class="student-checkbox-name">${student.firstName} ${student.lastName}</div>
                        <div class="student-checkbox-grade">Grade ${student.grade}</div>
                    </div>
                </div>
            `).join('');
        }

        function toggleStudent(studentId) {
            const index = selectedStudentIds.indexOf(studentId);
            if (index > -1) {
                selectedStudentIds.splice(index, 1);
            } else {
                selectedStudentIds.push(studentId);
            }
            updateStudentCheckboxes();
            updateEventLabel();
            updateEventCards();
        }

        function updateStudentCheckboxes() {
            const checkboxes = document.querySelectorAll('.student-checkbox');
            checkboxes.forEach(checkbox => {
                const studentId = checkbox.dataset.studentId;
                if (selectedStudentIds.includes(studentId)) {
                    checkbox.classList.add('selected');
                } else {
                    checkbox.classList.remove('selected');
                }
            });
        }

        function updateEventLabel() {
            const label = document.getElementById('eventLabel');
            label.textContent = selectedStudentIds.length > 0 ? 'Tap an Event' : 'Select students first';
        }

        function renderEventCards() {
            const eventGrid = document.getElementById('eventGrid');
            eventGrid.innerHTML = allEvents
                .filter(event => event.active !== false)
                .map(event => `
                    <div class="event-card" onclick="checkIn('${event.id}')">
                        <div class="event-name">${event.name}</div>
                    </div>
                `).join('');
            updateEventCards();
        }

        function updateEventCards() {
            const cards = document.querySelectorAll('.event-card');
            cards.forEach(card => {
                if (selectedStudentIds.length > 0) {
                    card.classList.remove('disabled');
                } else {
                    card.classList.add('disabled');
                }
            });
        }

        async function checkIn(eventId) {
            if (selectedStudentIds.length === 0) {
                showError('Please select at least one student');
                return;
            }

            const students = allStudents.filter(s => selectedStudentIds.includes(s.id));
            const event = allEvents.find(e => e.id === eventId);
            if (!students.length || !event) return;

            showScreen('loadingScreen');

            try {
                const today = new Date().toISOString().split('T')[0];
                
                // Check for existing check-ins today (1 read per student)
                const checkPromises = students.map(student => 
                    db.ref(`dailyCheckins/${student.id}/${today}`).once('value')
                );
                const checkResults = await Promise.all(checkPromises);
                
                // Filter out students who already checked in
                const alreadyCheckedIn = [];
                const studentsToCheckIn = [];
                
                students.forEach((student, index) => {
                    if (checkResults[index].exists()) {
                        alreadyCheckedIn.push(student);
                    } else {
                        studentsToCheckIn.push(student);
                    }
                });
                
                // Show warning if some students already checked in
                if (alreadyCheckedIn.length > 0) {
                    const names = alreadyCheckedIn.map(s => s.firstName).join(', ');
                    const wasWere = alreadyCheckedIn.length === 1 ? 'was' : 'were';
                    
                    if (studentsToCheckIn.length === 0) {
                        // All students already checked in
                        showError(`${names} ${wasWere} already checked in today!`);
                        showCheckinScreen();
                        return;
                    } else {
                        // Some checked in, some not - show info but continue with others
                        console.log(`Note: ${names} ${wasWere} already checked in today`);
                    }
                }
                
                // Proceed with students who haven't checked in
                const updates = {};
                
                for (const student of studentsToCheckIn) {
                    const checkinId = db.ref(`checkins/${today}`).push().key;
                    const checkinData = {
                        userId: currentUser.uid,
                        studentId: student.id,
                        studentName: `${student.firstName} ${student.lastName}`,
                        grade: student.grade,
                        eventName: event.name,
                        eventId: event.id,
                        timestamp: Date.now(),
                        parentEmail: currentUser.email,
                        familyKey: student.familyKey
                    };
                    
                    // Write check-in record
                    updates[`checkins/${today}/${checkinId}`] = checkinData;
                    
                    // Increment student count
                    updates[`studentCounts/${student.id}`] = firebase.database.ServerValue.increment(1);
                    
                    // Mark as checked in today (prevents duplicates)
                    updates[`dailyCheckins/${student.id}/${today}`] = event.name;
                }

                await db.ref().update(updates);

                // Get family total
                const familyKey = studentsToCheckIn[0].familyKey;
                const schoolYear = getCurrentSchoolYear();
                const familyTotal = await getFamilyYearTotal(familyKey);

                // Show success with names of students who were checked in
                const successNames = studentsToCheckIn.length === 1 
                    ? `${studentsToCheckIn[0].firstName} ${studentsToCheckIn[0].lastName}`
                    : studentsToCheckIn.map(s => s.firstName).join(', ');
                
                // Add note if some were skipped
                let successDetail = `<strong>${successNames}</strong>`;
                if (alreadyCheckedIn.length > 0) {
                    const skippedNames = alreadyCheckedIn.map(s => s.firstName).join(', ');
                    successDetail += `<br/><small style="color: var(--text-light); font-size: 0.9rem;">(${skippedNames} already checked in today)</small>`;
                }
                
                document.getElementById('successStudentNames').innerHTML = successDetail;
                document.getElementById('successEventName').textContent = event.name;
                document.getElementById('successSchoolYear').textContent = `${schoolYear.start}-${schoolYear.end} School Year`;
                document.getElementById('successFamilyTotal').textContent = familyTotal;
                
                showScreen('successScreen');

            } catch (error) {
                console.error('Error checking in:', error);
                showError('Failed to check in. Please try again.');
                showCheckinScreen();
            }
        }

        function returnToCheckin() {
            selectedStudentIds = [];
            showCheckinScreen();
        }

        function showScreen(screenId) {
            ['authScreen', 'setupScreen', 'checkinScreen', 'successScreen', 'loadingScreen'].forEach(id => {
                document.getElementById(id).classList.add('hidden');
            });
            document.getElementById(screenId).classList.remove('hidden');
        }

        function showSetupScreen() {
            selectedStudentsList = [];
            updateSelectedStudents();
            showScreen('setupScreen');
        }

        function showError(message) {
            const errorDiv = document.getElementById('authError');
            errorDiv.textContent = message;
            errorDiv.classList.remove('hidden');
        }

        function clearError() {
            document.getElementById('authError').classList.add('hidden');
        }
    </script>
</body>
