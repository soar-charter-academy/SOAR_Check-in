<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SOAR Check-In Admin Dashboard</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Spline+Sans+Mono:wght@500&display=swap');
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        :root {
            --primary: #2C5F7C;
            --accent: #E8934E;
            --success: #5FA85C;
            --bg: #F5F7FA;
            --card: #FFFFFF;
            --text: #1A202C;
            --text-light: #718096;
            --border: #E2E8F0;
            --shadow: rgba(0, 0, 0, 0.05);
        }
        
        body {
            font-family: 'Inter', sans-serif;
            background: var(--bg);
            color: var(--text);
            line-height: 1.6;
        }
        
        .header {
            background: white;
            border-bottom: 1px solid var(--border);
            padding: 16px 24px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 100;
        }
        
        .header-title {
            font-size: 1.5rem;
            font-weight: 700;
            color: var(--primary);
        }
        
        .header-actions {
            display: flex;
            gap: 12px;
            align-items: center;
        }
        
        .last-sync {
            font-size: 0.85rem;
            color: var(--text-light);
            font-family: 'Spline Sans Mono', monospace;
        }
        
        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 24px;
        }
        
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
            gap: 20px;
            margin-bottom: 32px;
        }
        
        .stat-card {
            background: white;
            border-radius: 12px;
            padding: 24px;
            box-shadow: 0 2px 8px var(--shadow);
        }
        
        .stat-label {
            font-size: 0.85rem;
            color: var(--text-light);
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 8px;
        }
        
        .stat-value {
            font-size: 2.5rem;
            font-weight: 700;
            color: var(--primary);
            font-family: 'Spline Sans Mono', monospace;
        }
        
        .stat-change {
            font-size: 0.85rem;
            color: var(--success);
            margin-top: 4px;
        }
        
        .card {
            background: white;
            border-radius: 12px;
            padding: 24px;
            margin-bottom: 24px;
            box-shadow: 0 2px 8px var(--shadow);
        }
        
        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }
        
        .card-title {
            font-size: 1.25rem;
            font-weight: 700;
            color: var(--text);
        }
        
        .filters {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 16px;
            margin-bottom: 24px;
        }
        
        .filter-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }
        
        .filter-label {
            font-size: 0.85rem;
            font-weight: 600;
            color: var(--text);
        }
        
        input, select {
            padding: 10px 12px;
            border: 2px solid var(--border);
            border-radius: 8px;
            font-family: 'Inter', sans-serif;
            font-size: 0.95rem;
            transition: all 0.2s;
        }
        
        input:focus, select:focus {
            outline: none;
            border-color: var(--primary);
        }
        
        .btn {
            padding: 10px 20px;
            border: none;
            border-radius: 8px;
            font-family: 'Inter', sans-serif;
            font-size: 0.95rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }
        
        .btn-primary {
            background: var(--primary);
            color: white;
        }
        
        .btn-primary:hover {
            background: #1E4158;
        }
        
        .btn-secondary {
            background: var(--bg);
            color: var(--text);
        }
        
        .btn-secondary:hover {
            background: #E2E8F0;
        }
        
        .data-table {
            width: 100%;
            border-collapse: collapse;
        }
        
        .data-table thead {
            background: var(--bg);
        }
        
        .data-table th {
            text-align: left;
            padding: 12px;
            font-weight: 600;
            font-size: 0.85rem;
            color: var(--text-light);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        
        .data-table td {
            padding: 14px 12px;
            border-bottom: 1px solid var(--border);
        }
        
        .data-table tbody tr:hover {
            background: var(--bg);
        }
        
        .chart-container {
            height: 300px;
            margin: 20px 0;
        }
        
        .bar-chart {
            display: flex;
            align-items: flex-end;
            justify-content: space-around;
            height: 100%;
            gap: 8px;
        }
        
        .bar {
            flex: 1;
            background: var(--primary);
            border-radius: 4px 4px 0 0;
            position: relative;
            transition: all 0.3s;
            cursor: pointer;
        }
        
        .bar:hover {
            background: var(--accent);
        }
        
        .bar-label {
            position: absolute;
            bottom: -24px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 0.75rem;
            color: var(--text-light);
            white-space: nowrap;
        }
        
        .bar-value {
            position: absolute;
            top: -24px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 0.85rem;
            font-weight: 600;
            color: var(--text);
        }
        
        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: var(--text-light);
        }
        
        .empty-state-icon {
            font-size: 3rem;
            margin-bottom: 12px;
        }
        
        .badge {
            display: inline-block;
            padding: 4px 10px;
            border-radius: 12px;
            font-size: 0.8rem;
            font-weight: 600;
        }
        
        .badge-primary {
            background: #E8F4F8;
            color: var(--primary);
        }
        
        .loading {
            text-align: center;
            padding: 40px;
        }
        
        .spinner {
            border: 3px solid var(--border);
            border-top: 3px solid var(--primary);
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto 16px;
        }
        
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        
        .hidden {
            display: none;
        }

        @media (max-width: 768px) {
            .container {
                padding: 16px;
            }
            
            .stats-grid {
                grid-template-columns: 1fr;
            }
            
            .filters {
                grid-template-columns: 1fr;
            }
            
            .header {
                flex-direction: column;
                gap: 12px;
                align-items: flex-start;
            }
        }
    </style>
</head>
<body>
    <div class="header">
        <div class="header-title">SOAR Check-In Dashboard</div>
        <div class="header-actions">
            <span class="last-sync" id="lastSync">Last sync: Loading...</span>
            <button class="btn btn-secondary" onclick="refreshData()">↻ Refresh</button>
            <button class="btn btn-primary" onclick="exportData()">↓ Export CSV</button>
        </div>
    </div>

    <div class="container">
        <!-- Stats Overview -->
        <div class="stats-grid">
            <div class="stat-card">
                <div class="stat-label">Today's Check-Ins</div>
                <div class="stat-value" id="todayCount">0</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">This Week</div>
                <div class="stat-value" id="weekCount">0</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">This Month</div>
                <div class="stat-value" id="monthCount">0</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">Total Students</div>
                <div class="stat-value" id="studentCount">0</div>
            </div>
        </div>

        <!-- Filters -->
        <div class="card">
            <div class="card-header">
                <h2 class="card-title">Filters</h2>
                <button class="btn btn-secondary" onclick="resetFilters()">Reset</button>
            </div>
            <div class="filters">
                <div class="filter-group">
                    <label class="filter-label">Date From</label>
                    <input type="date" id="dateFrom">
                </div>
                <div class="filter-group">
                    <label class="filter-label">Date To</label>
                    <input type="date" id="dateTo">
                </div>
                <div class="filter-group">
                    <label class="filter-label">Grade</label>
                    <select id="gradeFilter">
                        <option value="">All Grades</option>
                    </select>
                </div>
                <div class="filter-group">
                    <label class="filter-label">Event</label>
                    <select id="eventFilter">
                        <option value="">All Events</option>
                    </select>
                </div>
            </div>
            <button class="btn btn-primary" onclick="applyFilters()">Apply Filters</button>
        </div>

        <!-- Analytics Charts -->
        <div class="card">
            <div class="card-header">
                <h2 class="card-title">Check-Ins by Grade</h2>
            </div>
            <div class="chart-container">
                <div class="bar-chart" id="gradeChart"></div>
            </div>
        </div>

        <div class="card">
            <div class="card-header">
                <h2 class="card-title">Popular Events</h2>
            </div>
            <div class="chart-container">
                <div class="bar-chart" id="eventChart"></div>
            </div>
        </div>

        <!-- Recent Check-Ins Table -->
        <div class="card">
            <div class="card-header">
                <h2 class="card-title">Recent Check-Ins</h2>
                <span class="badge badge-primary" id="recordCount">0 records</span>
            </div>
            <div id="tableContainer">
                <table class="data-table">
                    <thead>
                        <tr>
                            <th>Date/Time</th>
                            <th>Student</th>
                            <th>Grade</th>
                            <th>Event</th>
                            <th>Parent Email</th>
                        </tr>
                    </thead>
                    <tbody id="checkinTable"></tbody>
                </table>
            </div>
        </div>

        <!-- Loading State -->
        <div id="loadingState" class="card hidden">
            <div class="loading">
                <div class="spinner"></div>
                <div>Loading data...</div>
            </div>
        </div>
    </div>

    <!-- Firebase -->
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script>

    <script>
        // Firebase configuration - REPLACE WITH YOUR FIREBASE CONFIG
        const firebaseConfig = {
            apiKey: "AIzaSyANNylnmxNVFpKVTin0MBayvrNgXNlxF6c",
            authDomain: "soar-check-in.firebaseapp.com",
            databaseURL: "https://soar-check-in-default-rtdb.firebaseio.com",
            projectId: "soar-check-in",
            storageBucket: "soar-check-in.firebasestorage.app",
            messagingSenderId: "595921529463",
            appId: "1:595921529463:web:2376d566bd694ce583b472"
        };

        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        let allCheckins = [];
        let filteredCheckins = [];
        let allStudents = [];
        let allEvents = [];

        // Initialize
        document.addEventListener('DOMContentLoaded', async () => {
            setDefaultDates();
            await loadData();
        });

        function setDefaultDates() {
            const today = new Date();
            const thirtyDaysAgo = new Date(today);
            thirtyDaysAgo.setDate(today.getDate() - 30);

            document.getElementById('dateTo').valueAsDate = today;
            document.getElementById('dateFrom').valueAsDate = thirtyDaysAgo;
        }

        async function loadData() {
            showLoading(true);

            try {
                // Load students and events
                const [studentsSnap, eventsSnap, metadataSnap] = await Promise.all([
                    db.ref('students').once('value'),
                    db.ref('events').once('value'),
                    db.ref('metadata').once('value')
                ]);

                allStudents = [];
                studentsSnap.forEach(child => {
                    allStudents.push({ id: child.key, ...child.val() });
                });

                allEvents = [];
                eventsSnap.forEach(child => {
                    allEvents.push({ id: child.key, ...child.val() });
                });

                // Update last sync
                const metadata = metadataSnap.val();
                if (metadata && metadata.lastSync) {
                    const syncDate = new Date(metadata.lastSync);
                    document.getElementById('lastSync').textContent = 
                        `Last sync: ${syncDate.toLocaleString()}`;
                }

                // Populate filter dropdowns
                populateFilters();

                // Load check-ins
                await loadCheckins();

            } catch (error) {
                console.error('Error loading data:', error);
                alert('Failed to load data. Please refresh the page.');
            }

            showLoading(false);
        }

        function populateFilters() {
            // Populate grades
            const grades = [...new Set(allStudents.map(s => s.grade))].sort();
            const gradeSelect = document.getElementById('gradeFilter');
            gradeSelect.innerHTML = '<option value="">All Grades</option>' +
                grades.map(g => `<option value="${g}">Grade ${g}</option>`).join('');

            // Populate events
            const eventSelect = document.getElementById('eventFilter');
            eventSelect.innerHTML = '<option value="">All Events</option>' +
                allEvents.map(e => `<option value="${e.name}">${e.name}</option>`).join('');
        }

        async function loadCheckins() {
            const dateFrom = document.getElementById('dateFrom').value;
            const dateTo = document.getElementById('dateTo').value;

            if (!dateFrom || !dateTo) return;

            allCheckins = [];

            // Generate list of dates in range
            const dates = getDateRange(new Date(dateFrom), new Date(dateTo));

            // Fetch check-ins for each date
            const promises = dates.map(date => 
                db.ref(`checkins/${date}`).once('value')
            );

            const snapshots = await Promise.all(promises);

            snapshots.forEach(snap => {
                snap.forEach(child => {
                    allCheckins.push({ id: child.key, ...child.val() });
                });
            });

            // Sort by timestamp descending
            allCheckins.sort((a, b) => b.timestamp - a.timestamp);

            applyFilters();
        }

        function getDateRange(start, end) {
            const dates = [];
            const current = new Date(start);
            
            while (current <= end) {
                dates.push(current.toISOString().split('T')[0]);
                current.setDate(current.getDate() + 1);
            }
            
            return dates;
        }

        function applyFilters() {
            const gradeFilter = document.getElementById('gradeFilter').value;
            const eventFilter = document.getElementById('eventFilter').value;

            filteredCheckins = allCheckins.filter(checkin => {
                if (gradeFilter && checkin.grade !== gradeFilter) return false;
                if (eventFilter && checkin.eventName !== eventFilter) return false;
                return true;
            });

            updateStats();
            updateCharts();
            updateTable();
        }

        function updateStats() {
            const now = Date.now();
            const today = new Date().toISOString().split('T')[0];
            const weekAgo = now - (7 * 24 * 60 * 60 * 1000);
            const monthAgo = now - (30 * 24 * 60 * 60 * 1000);

            const todayCheckins = filteredCheckins.filter(c => {
                const checkinDate = new Date(c.timestamp).toISOString().split('T')[0];
                return checkinDate === today;
            });

            const weekCheckins = filteredCheckins.filter(c => c.timestamp >= weekAgo);
            const monthCheckins = filteredCheckins.filter(c => c.timestamp >= monthAgo);

            document.getElementById('todayCount').textContent = todayCheckins.length;
            document.getElementById('weekCount').textContent = weekCheckins.length;
            document.getElementById('monthCount').textContent = monthCheckins.length;
            document.getElementById('studentCount').textContent = allStudents.length;
        }

        function updateCharts() {
            // Grade chart
            const gradeData = {};
            filteredCheckins.forEach(checkin => {
                const grade = checkin.grade || 'Unknown';
                gradeData[grade] = (gradeData[grade] || 0) + 1;
            });

            const gradeSorted = Object.entries(gradeData).sort((a, b) => {
                const gradeA = a[0] === 'Unknown' ? 999 : parseInt(a[0]);
                const gradeB = b[0] === 'Unknown' ? 999 : parseInt(b[0]);
                return gradeA - gradeB;
            });

            renderBarChart('gradeChart', gradeSorted, grade => `Grade ${grade}`);

            // Event chart
            const eventData = {};
            filteredCheckins.forEach(checkin => {
                const event = checkin.eventName || 'Unknown';
                eventData[event] = (eventData[event] || 0) + 1;
            });

            const eventSorted = Object.entries(eventData)
                .sort((a, b) => b[1] - a[1])
                .slice(0, 10);

            renderBarChart('eventChart', eventSorted, name => name.length > 20 ? name.substring(0, 17) + '...' : name);
        }

        function renderBarChart(containerId, data, labelFormatter) {
            const container = document.getElementById(containerId);
            
            if (data.length === 0) {
                container.innerHTML = '<div class="empty-state"><div class="empty-state-icon">📊</div><div>No data to display</div></div>';
                return;
            }

            const maxValue = Math.max(...data.map(d => d[1]));

            container.innerHTML = data.map(([label, value]) => {
                const height = (value / maxValue) * 100;
                return `
                    <div class="bar" style="height: ${height}%" title="${label}: ${value}">
                        <div class="bar-value">${value}</div>
                        <div class="bar-label">${labelFormatter(label)}</div>
                    </div>
                `;
            }).join('');
        }

        function updateTable() {
            const tbody = document.getElementById('checkinTable');
            const recordCount = document.getElementById('recordCount');

            recordCount.textContent = `${filteredCheckins.length} records`;

            if (filteredCheckins.length === 0) {
                tbody.innerHTML = '<tr><td colspan="5" style="text-align: center; padding: 40px; color: var(--text-light);">No check-ins found</td></tr>';
                return;
            }

            // Show most recent 100
            const displayCheckins = filteredCheckins.slice(0, 100);

            tbody.innerHTML = displayCheckins.map(checkin => {
                const date = new Date(checkin.timestamp);
                return `
                    <tr>
                        <td>${date.toLocaleString()}</td>
                        <td><strong>${checkin.studentName}</strong></td>
                        <td>Grade ${checkin.grade}</td>
                        <td>${checkin.eventName}</td>
                        <td>${checkin.parentEmail}</td>
                    </tr>
                `;
            }).join('');
        }

        function resetFilters() {
            setDefaultDates();
            document.getElementById('gradeFilter').value = '';
            document.getElementById('eventFilter').value = '';
            loadCheckins();
        }

        async function refreshData() {
            await loadData();
        }

        function exportData() {
            if (filteredCheckins.length === 0) {
                alert('No data to export');
                return;
            }

            // Create CSV
            const headers = ['Date', 'Time', 'Student Name', 'Student ID', 'Grade', 'Event', 'Parent Email'];
            const rows = filteredCheckins.map(checkin => {
                const date = new Date(checkin.timestamp);
                return [
                    date.toLocaleDateString(),
                    date.toLocaleTimeString(),
                    checkin.studentName,
                    checkin.studentId || '',
                    checkin.grade,
                    checkin.eventName,
                    checkin.parentEmail
                ];
            });

            const csv = [
                headers.join(','),
                ...rows.map(row => row.map(field => `"${field}"`).join(','))
            ].join('\n');

            // Download
            const blob = new Blob([csv], { type: 'text/csv' });
            const url = window.URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `soar-checkins-${new Date().toISOString().split('T')[0]}.csv`;
            a.click();
            window.URL.revokeObjectURL(url);
        }

        function showLoading(show) {
            // For now, just disable buttons during loading
            // Could add a proper loading overlay
        }
    </script>
</body>
</html>
